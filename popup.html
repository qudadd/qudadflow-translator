<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QudadFlow Translator</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="src/model-picker.css">
  <link rel="stylesheet" href="src/version.css">
</head>
<body>
  <main class="popup">
    <div class="brand"><img src="assets/icon32.png" alt=""><div><h1>QudadFlow Translator</h1><p>默认机器翻译，也可选择自己的 API</p></div></div>
    <section id="siteAuthorization" class="site-authorization" aria-labelledby="siteAuthorizationTitle" hidden>
      <div class="site-authorization-row"><div><h2 id="siteAuthorizationTitle">当前网站未授权</h2><p id="siteAuthorizationHint"></p></div><button id="authorizeCurrentSite" class="primary" type="button" disabled>授权当前网站</button></div>
      <details id="siteAuthorizationDetails"><summary>授权说明</summary><p>允许读取本站页面，用于沉浸式翻译、划词和快捷键。点击后由浏览器确认，范围为该协议和主机的所有端口；不会发起翻译或自动开启划词，可在扩展设置中撤销。</p></details>
    </section>
    <label for="activeModel">翻译模型</label><select id="activeModel" disabled></select><p class="hint">自动读取当前 API 的上游模型。新增或切换 API 请打开设置。</p>
    <label for="targetLanguage">目标语言</label>
    <select id="targetLanguage">
      <option value="zh-CN">简体中文</option>
      <option value="zh-TW">繁體中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
      <option value="ru">Русский</option>
    </select>
    <button class="primary" id="translateImmersive">沉浸式翻译当前网页</button>
    <button class="secondary" id="restoreImmersive">恢复网页原文</button>
    <button class="secondary" id="openDocument">PDF / 文档左右对照</button>
    <button class="secondary" id="openResearch">论文阅读与问答</button>
    <p class="hint">先在本地提取正文与图表；可能遗漏的内容可在论文窗口内补图，再按需交给 AI 识别。</p>
    <div class="selection-tools"><label class="site-toggle"><input id="selectionEnabled" type="checkbox" disabled> 在此网站启用划词翻译按钮</label><p class="hint">开启后，选中文字即可就近点击“翻译”。仅点击后发送文本；可随时关闭。</p></div>
    <div class="selection" id="selection">正在读取选中文本…</div>
    <button class="secondary" id="translateSelection">翻译当前选中文字</button>
    <button class="text-action" id="translatePage">更多：在独立面板翻译网页文本</button>
    <p class="status" id="status" role="status"></p>
    <div class="footer"><button id="openOptions">API 与翻译设置</button><a href="privacy.html" target="_blank">隐私说明</a></div>
    <a class="community" href="options.html#communitySupport" target="_blank" rel="noopener">QQ 交流群 <strong>1048123205</strong><span aria-hidden="true">↗</span></a>
  </main>
  <script src="popup.js"></script>
  <script src="src/version.js"></script>
</body>
</html>

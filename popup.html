<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QudadFlow Translator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <div class="brand"><img src="assets/icon32.png" alt=""><div><h1>QudadFlow Translator</h1><p>使用你配置的第三方 API</p></div></div>
    <label for="targetLanguage">目标语言</label>
    <select id="targetLanguage">
      <option value="zh-CN">简体中文</option>
      <option value="zh-TW">繁體中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
      <option value="ru">Русский</option>
    </select>
    <div class="selection" id="selection">正在读取选中文本…</div>
    <button class="primary" id="translateSelection">翻译选中文本</button>
    <button class="secondary" id="translatePage">翻译当前网页</button>
    <button class="secondary" id="translateImmersive">沉浸式翻译（原文下方显示译文）</button>
    <button class="secondary" id="restoreImmersive">恢复网页原文</button>
    <p class="status" id="status" role="status"></p>
    <div class="footer"><button id="openOptions">API 与翻译设置</button><a href="privacy.html" target="_blank">隐私说明</a></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>

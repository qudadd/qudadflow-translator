<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QudadFlow Translator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <div class="brand"><img src="assets/icon32.png" alt=""><div><h1>QudadFlow Translator</h1><p>使用你配置的第三方 API</p></div></div>
    <label for="activeProfile">翻译方案</label><select id="activeProfile"><option value="">当前配置</option></select><p class="hint">在 API 设置中保存、编辑方案；免 Key 基础试用也在设置中启用。</p>
    <label for="targetLanguage">目标语言</label>
    <select id="targetLanguage">
      <option value="zh-CN">简体中文</option>
      <option value="zh-TW">繁體中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
      <option value="ru">Русский</option>
    </select>
    <button class="primary" id="translateImmersive">沉浸式翻译当前网页</button>
    <button class="secondary" id="restoreImmersive">恢复网页原文</button>
    <button class="secondary" id="openDocument">PDF / 文档左右对照</button>
    <div class="selection-tools"><label class="site-toggle"><input id="selectionEnabled" type="checkbox" disabled> 在此网站启用划词翻译按钮</label><p class="hint">开启后，选中文字即可就近点击“翻译”。仅点击后发送文本；可随时关闭。</p></div>
    <div class="selection" id="selection">正在读取选中文本…</div>
    <button class="secondary" id="translateSelection">翻译当前选中文字</button>
    <button class="text-action" id="translatePage">更多：在独立面板翻译网页文本</button>
    <p class="status" id="status" role="status"></p>
    <div class="footer"><button id="openOptions">API 与翻译设置</button><a href="privacy.html" target="_blank">隐私说明</a></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>

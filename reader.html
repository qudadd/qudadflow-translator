<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QudadFlow Translator · Document Reader</title><link rel="icon" href="assets/icon32.png"><link rel="stylesheet" href="vendor/pdfjs/web/pdf_viewer.css"><link rel="stylesheet" href="reader.css"></head>
<body>
  <header class="app-header"><a class="brand" href="reader.html"><img src="assets/icon48.png" alt=""><span>QudadFlow Translator<small>DOCUMENT READER</small></span></a><div class="header-actions"><button id="cancelLoad" hidden>取消加载</button><button id="openFile">打开文件</button><button id="showLink">打开链接</button><button id="settings" class="subtle">API 设置</button></div></header>
  <input id="file" type="file" accept=".pdf,.docx,.txt,.md,.markdown" hidden>
  <form id="linkForm" class="link-form" hidden><label for="documentUrl">PDF / 文档链接</label><input id="documentUrl" type="url" placeholder="https://example.com/document.pdf" autocomplete="off"><button type="submit">打开文档</button></form>
  <section class="toolbar" aria-label="阅读工具"><div class="document-title"><strong id="fileName">你的文档，两种语言。</strong><span id="fileDetail">PDF · Word DOCX · TXT · Markdown</span></div><label class="target">译为<select id="targetLanguage"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option><option value="ru">Русский</option></select></label><button id="translatePage" class="primary" disabled>翻译当前页</button><button id="translateAll" disabled>翻译全文</button><button id="stop" hidden>停止翻译</button><button id="export" disabled>导出双语 TXT</button></section>
  <div class="reading-controls"><div class="pagination"><button id="previous" disabled aria-label="上一页">←</button><label><input id="pageNumber" type="number" min="1" value="1" disabled aria-label="页码"> / <span id="pageCount">—</span></label><button id="next" disabled aria-label="下一页">→</button></div><label class="sync"><input id="syncScroll" type="checkbox" checked>同步滚动</label><p id="status" role="status">文件在浏览器内解析；点击翻译后，仅将文字发送到你配置的 API。</p></div>
  <main id="workspace" class="workspace" hidden>
    <section class="reading-column" aria-label="原文"><header><span>原文</span><small id="sourceLabel">保留原文</small></header><div id="sourcePane" class="pane"><div id="sourceContent"></div></div></section>
    <section class="reading-column" aria-label="译文"><header><span>译文</span><small id="translationLabel">逐段对应 · 流式显示</small></header><div id="translationPane" class="pane"><div id="translationContent"></div></div></section>
  </main>
  <main id="welcome" class="welcome"><div class="welcome-mark"><img src="assets/icon128.png" alt=""></div><p class="eyebrow">READ SIDE BY SIDE</p><h1>保留原页，从容阅读译文。</h1><p>把 PDF 或文档拖到这里，或选择本地文件。<br>也可以从浏览器正在查看的 PDF 转入此阅读器。</p><button id="chooseFile" class="primary">选择文档</button><p class="file-note">PDF / DOCX / TXT / Markdown · 最大 25 MB<br>PDF 按页对照；Word 与文本按段落阅读排版。扫描图片需先进行 OCR。</p></main>
  <script type="module" src="reader.js"></script>
</body></html>
